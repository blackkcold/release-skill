name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Build distribution
        run: bash scripts/build-dist.sh
      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
            if [ "$COUNT" -gt 0 ]; then
              echo "Release $TAG already has assets (published by release.sh); skipping."
              exit 0
            fi
            gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 \
              --title "$TAG" \
              --notes "Release $TAG. See CHANGELOG.md."
          fi
